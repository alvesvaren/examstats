name: Nightly snapshot

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      # A Vercel deploy hook rebuilds production, and every build fetches a fresh snapshot.
      - run: curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK"
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
