name: Nightly results

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Both data workflows merge into main, so they take turns.
concurrency: data-commit

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails while stats.ftek.se is down, which leaves the committed results as they are.
      - run: pnpm fetch-results
      # Results change a few times per study period. main only takes pull requests, so the
      # commit goes through one that merges at once. The merge deploys the site.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          if git diff --cached --quiet; then
            echo "No new results"
            exit 0
          fi
          branch="data/results-${{ github.run_id }}"
          git switch -c "$branch"
          git commit -m "Update exam results"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Update exam results" --body "From the nightly fetch."
          gh pr merge "$branch" --squash --delete-branch
