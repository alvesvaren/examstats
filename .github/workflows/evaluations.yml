name: Monthly course surveys

on:
  schedule:
    - cron: "43 4 2 * *"
  workflow_dispatch:

permissions:
  contents: write

# Both data workflows push to main, so they take turns.
concurrency: data-commit

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails while the survey site is down, which leaves the committed surveys as they are.
      - run: pnpm evaluations
      # The file carries its fetch time, so there is always a commit. A push deploys the site.
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evaluations.json
          git commit -m "Update course surveys"
          git pull --rebase
          git push
