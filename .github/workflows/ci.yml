name: CI

on:
  push:
    branches: [main]
  pull_request:
    # The data workflows open data-only pull requests with GITHUB_TOKEN and merge them at once.
    # CI on them waits for approval and fails when the merge closes the pull request unapproved.
    paths-ignore: ["data/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test --run
